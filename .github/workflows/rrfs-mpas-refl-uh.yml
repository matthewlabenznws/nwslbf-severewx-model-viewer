name: RRFS-MPAS R2

on:
  workflow_dispatch:

permissions:
  contents: read

# Prevent two RRFS-MPAS jobs from running at the same time.
# This will be especially important once cron-job.org triggers
# the workflow every 15 minutes.
concurrency:
  group: rrfs-mpas-refl-uh
  cancel-in-progress: false

jobs:
  run-rrfs-mpas-r2:
    runs-on: ubuntu-latest

    # Allows plenty of time for slower 00Z/12Z runs or an
    # initial run that has several forecast hours to process.
    timeout-minutes: 180

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # PYTHON
      # ---------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'


      # ---------------------------------------------------------
      # DEPENDENCIES
      # ---------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ---------------------------------------------------------
      # VERIFY ECCODES
      # ---------------------------------------------------------

      - name: Verify ecCodes
        run: |
          python - <<'PY'
          import eccodes

          print("ecCodes imported successfully.")
          print("RRFS-MPAS GRIB2 environment is ready.")
          PY


      # ---------------------------------------------------------
      # VERIFY MAP ASSETS
      #
      # c_18mr25.zip is checked here instead of c_18mr25.shp.
      # rrfs_mpas_refl_uh.py extracts the ZIP after it starts.
      # ---------------------------------------------------------

      - name: Verify map assets
        shell: bash
        run: |
          set -e

          required_files=(
            "assets/cb_2018_us_county_500k.shp"
            "assets/cb_2018_us_state_500k.shp"
            "assets/c_18mr25.zip"
            "assets/NOAANWSLogos.png"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required asset: $file"
              exit 1
            fi

            echo "Found: $file"
          done

          echo "All required map assets are available."


      # ---------------------------------------------------------
      # RUN RRFS-MPAS
      #
      # The Python script:
      #   * scans the GSL FTP
      #   * finds 00/03/06/09/12/15/18/21Z runs
      #   * downloads only needed forecast hours
      #   * processes each GRIB once
      #   * creates all required domains
      #   * uploads PNGs to R2
      #   * updates runs.json incrementally
      #
      # 00Z / 12Z -> through F048
      # Other 3-hour cycles -> through F012
      # ---------------------------------------------------------

      - name: Run RRFS-MPAS R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}

          GSL_FTP_EMAIL: ${{ secrets.GSL_FTP_EMAIL }}

          PYTHONUNBUFFERED: '1'
          MPLBACKEND: 'Agg'

        run: |
          python -u rrfs_mpas_refl_uh.py


      # ---------------------------------------------------------
      # CLEANUP
      #
      # Runs even if the Python script fails.
      # ---------------------------------------------------------

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          echo "Cleaning RRFS-MPAS temporary files..."

          rm -rf /tmp/rrfs_mpas_* || true

          find . \
            -type f \
            -name "*.rrfs.t*z.testbed.f*.conus.grib2" \
            -delete || true

          echo "Cleanup complete."
