name: RRFS-MPAS R2

on:
  workflow_dispatch:

permissions:
  contents: read

# Prevent multiple RRFS-MPAS publishers from running at the same time.
# This is important because cron-job.org will trigger the workflow
# every 15 minutes, while a large 00Z/12Z update may take longer.
#
# Do NOT cancel a run already in progress. A later trigger will wait
# rather than interrupting an active FTP download / R2 upload.
concurrency:
  group: rrfs-mpas-refl-uh
  cancel-in-progress: false

jobs:
  run-rrfs-mpas-r2:
    runs-on: ubuntu-latest

    # Gives a larger incremental update plenty of time to finish.
    timeout-minutes: 180

    steps:
      # ----------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # PYTHON 3.11
      # ----------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ----------------------------------------------------------
      # INSTALL EXISTING PROJECT REQUIREMENTS
      #
      # Make sure "eccodes" is included in requirements.txt.
      # ----------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------
      # VERIFY ECCODES
      #
      # RRFS-MPAS uses the Python ecCodes interface directly
      # instead of Herbie for reading the GSL GRIB2 files.
      # ----------------------------------------------------------

      - name: Verify ecCodes
        run: |
          python - <<'PY'
          import eccodes

          print("ecCodes imported successfully.")
          print("RRFS-MPAS GRIB2 environment is ready.")
          PY

      # ----------------------------------------------------------
      # VERIFY MAP ASSETS
      #
      # These are the same repository assets used by the HRRR
      # plotting code.
      # ----------------------------------------------------------

      - name: Verify map assets
        shell: bash
        run: |
          set -e

          required_files=(
            "assets/cb_2018_us_county_500k.shp"
            "assets/cb_2018_us_state_500k.shp"
            "assets/c_18mr25.shp"
            "assets/NOAANWSLogos.png"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required asset: $file"
              exit 1
            fi

            echo "Found: $file"
          done

          echo "All required map assets are available."

      # ----------------------------------------------------------
      # RUN RRFS-MPAS
      #
      # GSL_FTP_EMAIL is stored as a GitHub repository secret.
      #
      # The Python script will:
      #
      # 00Z -> F000-F048
      # 03Z -> F000-F012
      # 06Z -> F000-F012
      # 09Z -> F000-F012
      # 12Z -> F000-F048
      # 15Z -> F000-F012
      # 18Z -> F000-F012
      # 21Z -> F000-F012
      #
      # It checks R2 first and only downloads/processes forecast
      # hours that are not already complete.
      # ----------------------------------------------------------

      - name: Run RRFS-MPAS R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}

          GSL_FTP_EMAIL: ${{ secrets.GSL_FTP_EMAIL }}

          PYTHONUNBUFFERED: '1'
          MPLBACKEND: 'Agg'

        run: |
          python -u rrfs_mpas_refl_uh.py

      # ----------------------------------------------------------
      # CLEANUP
      #
      # The Python script already removes each ~150 MB GRIB2
      # after processing. This is an additional safety cleanup
      # and runs even if the Python script fails.
      # ----------------------------------------------------------

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          echo "Cleaning RRFS-MPAS temporary files..."

          rm -rf /tmp/rrfs_mpas_* || true

          find . \
            -type f \
            -name "*.rrfs.t*z.testbed.f*.conus.grib2" \
            -delete || true

          echo "Cleanup complete."
