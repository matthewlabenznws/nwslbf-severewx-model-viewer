name: Update RRFS ECAPE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rrfs-ecape:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECK OUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # INSTALL SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libeccodes0 \
            libeccodes-dev


      # ======================================================
      # INSTALL PYTHON DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy \
            scipy \
            pandas \
            xarray \
            cfgrib \
            eccodes \
            metpy \
            matplotlib \
            cartopy \
            geopandas \
            shapely \
            pyshp \
            requests \
            tqdm \
            boto3


      # ======================================================
      # CHECK PYTHON / IMPORTANT PACKAGES
      # ======================================================

      - name: Check Python packages
        run: |
          python --version

          python -c "import eccodes; print('eccodes loaded successfully')"
          python -c "import cfgrib; print('cfgrib loaded successfully')"
          python -c "import geopandas; print('geopandas loaded successfully')"
          python -c "import cartopy; print('cartopy loaded successfully')"
          python -c "import metpy; print('MetPy loaded successfully')"


      # ======================================================
      # CHECK R2 ENVIRONMENT VARIABLES
      # ======================================================

      - name: Check R2 configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        run: |
          echo "Checking required R2 environment variables..."

          test -n "$AWS_ACCESS_KEY_ID" || {
            echo "ERROR: AWS_ACCESS_KEY_ID is not set"
            exit 1
          }

          test -n "$AWS_SECRET_ACCESS_KEY" || {
            echo "ERROR: AWS_SECRET_ACCESS_KEY is not set"
            exit 1
          }

          test -n "$AWS_ENDPOINT_URL" || {
            echo "ERROR: AWS_ENDPOINT_URL is not set"
            exit 1
          }

          test -n "$AWS_BUCKET" || {
            echo "ERROR: AWS_BUCKET is not set"
            exit 1
          }

          echo "R2 environment variables are configured."


      # ======================================================
      # RUN RRFS ECAPE SCRIPT
      # ======================================================

      - name: Generate RRFS ECAPE graphics
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        run: |
          python rrfs_ecape.py


      # ======================================================
      # SHOW GENERATED FILES
      # ======================================================

      - name: Show generated RRFS ECAPE files
        if: always()
        run: |
          echo "========================================"
          echo "RRFS ECAPE GENERATED FILES"
          echo "========================================"

          find site/runs/cams/rrfs/ecape \
            -type f \
            2>/dev/null \
            | sort \
            || true


      # ======================================================
      # SHOW TEMPORARY FILES IF SCRIPT FAILS
      # ======================================================

      - name: Show temporary RRFS files
        if: failure()
        run: |
          echo "========================================"
          echo "TEMPORARY RRFS FILES"
          echo "========================================"

          find rrfs_ecape_subsets \
            -type f \
            2>/dev/null \
            | sort \
            || true


      # ======================================================
      # CLEAN UP TEMPORARY GRIB FILES
      # ======================================================

      - name: Clean temporary RRFS files
        if: always()
        run: |
          rm -rf rrfs_ecape_subsets

          find . \
            -type f \
            \( \
              -name "*.grib2" \
              -o \
              -name "*.grib2.*" \
              -o \
              -name "*.idx" \
            \) \
            -delete \
            2>/dev/null \
            || true


      # ======================================================
      # COMPLETE
      # ======================================================

      - name: RRFS ECAPE workflow complete
        if: success()
        run: |
          echo "RRFS ECAPE workflow completed successfully."
