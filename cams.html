<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CAMs Viewer</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #111 0%, #080808 100%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .navbar, .subbar {
      text-align: left;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .navbar {
      background: #1a1a1a;
      padding: 14px 24px;
      font-size: 22px;
    }

    .subbar {
      background: #151515;
      padding: 10px 24px;
      font-size: 16px;
    }

    .navbar a, .subbar a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
      transition: 0.2s ease;
    }

    .navbar a:hover, .subbar a:hover {
      color: #6ea8ff;
      text-shadow: 0 0 10px rgba(110,168,255,0.35);
    }

    .navbar span, .subbar span {
      color: #777;
    }

    .topbar {
      background: #1b1b1b;
      padding: 14px 18px;
      border-bottom: 1px solid #333;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    select, button {
      background: #2c2c2c;
      color: white;
      border: 1px solid #555;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    select:hover, button:hover {
      border-color: #6ea8ff;
      box-shadow: 0 0 10px rgba(110,168,255,0.2);
    }

    .topbar label {
      font-weight: bold;
    }

    .topbar select {
      min-width: 120px;
    }

    #runSelect {
      min-width: 170px;
    }

    #domainSelect {
      min-width: 150px;
    }

    #memberBlock,
    #rightProductBlock {
      display: none;
      align-items: center;
      gap: 7px;
    }

    #viewerTitle {
      font-size: 22px;
      font-weight: 800;
      margin-right: 18px;
    }

    .controls {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 12px;
      padding: 12px 16px;
      background: #181818;
      border-bottom: 1px solid #2c2c2c;
    }

    input[type="range"] {
      width: 100%;
    }

    .save-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #151515;
      border-bottom: 1px solid #2c2c2c;
    }

    .save-controls label {
      font-weight: bold;
      font-size: 14px;
    }

    .gif-range {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 245px;
    }

    .gif-range input[type="range"] {
      width: 150px;
    }

    .range-value {
      min-width: 38px;
      font-weight: bold;
      color: #9ec0ff;
    }

    .loop-option {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    #saveStatus {
      min-width: 130px;
      color: #aaa;
      font-size: 13px;
      text-align: left;
    }

    .tiles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      padding: 6px 10px 2px 10px;
      background: #101010;
    }

    .frame {
      min-width: 44px;
      padding: 6px 9px;
      border-radius: 5px;
      transition: 0.2s ease;
    }

    .available {
      background: #2b7cff;
      color: white;
      border-color: #9ec0ff;
      cursor: pointer;
    }

    .available:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(110,168,255,0.35);
    }

    .missing {
      background: #111;
      color: #aaa;
      border-color: #555;
    }

    .frame:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .active {
      outline: 2px solid white;
    }

    .plot-wrap {
      padding: 12px 16px 40px 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .plot-wrap.compare {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .plot-panel {
      min-width: 0;
    }

    .panel-title {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 800;
      color: #ddd;
    }

    .plot-image {
      width: auto;
      max-width: 70vw;
      height: auto;
      border: 1px solid #333;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 0 22px rgba(0,0,0,0.45);
      image-rendering: auto;
    }

    .plot-wrap.compare .plot-image {
      width: 100%;
      max-width: 100%;
    }

    #rightPanel {
      display: none;
    }

    .footer {
      color: #777;
      font-size: 15px;
      margin: 28px 0 34px 0;
      line-height: 1.6;
    }

    button:disabled,
    select:disabled,
    input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .navbar {
        font-size: 18px;
      }

      .subbar {
        font-size: 14px;
      }

      #viewerTitle {
        width: 100%;
        margin-bottom: 8px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .save-controls {
        flex-direction: column;
      }

      .gif-range {
        width: 100%;
        justify-content: center;
      }

      #saveStatus {
        text-align: center;
      }

      .plot-wrap,
      .plot-wrap.compare {
        grid-template-columns: 1fr;
      }

      .plot-image,
      .plot-wrap.compare .plot-image {
        width: 100%;
        max-width: 96vw;
      }
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="index.html">HOME</a>
  <span>/</span>
  <a href="cams.html?model=hrrr">CAMs</a>
  <span>/</span>
  <a href="mesoensprob.html">MESO-ENS PROB</a>
</div>

<div class="subbar">
  <a href="cams.html?model=hrrr">HRRR</a>
  <span>/</span>
  <a href="cams.html?model=rrfs">RRFS</a>
  <span>/</span>
  <a href="cams.html?model=refs&member=m01">REFS MEM01-05</a>
</div>

<div class="topbar">
  <b id="viewerTitle">HRRR Reflectivity/UH</b>

  <label>View:</label>
  <select id="viewSelect" onchange="changeView()">
    <option value="single">Single Panel</option>
    <option value="compare">Compare Products</option>
  </select>

  <label>Model:</label>
  <select id="modelSelect" onchange="changeModel()">
    <option value="hrrr">HRRR</option>
    <option value="rrfs">RRFS</option>
    <option value="refs">REFS</option>
  </select>

  <span id="memberBlock">
    <label>Member:</label>
    <select id="memberSelect" onchange="changeMember()">
      <option value="m01">M01</option>
      <option value="m02">M02</option>
      <option value="m03">M03</option>
      <option value="m04">M04</option>
      <option value="m05">M05</option>
    </select>
  </span>

  <label id="leftProductLabel">Product:</label>
  <select id="leftProductSelect" onchange="changeLeftProduct()"></select>

  <span id="rightProductBlock">
    <label>Right Product:</label>
    <select id="rightProductSelect" onchange="changeRightProduct()"></select>
  </span>

  <label>Run:</label>
  <select id="runSelect" onchange="changeRun()"></select>

  <label>Domain:</label>
  <select id="domainSelect" onchange="changeDomain()">
    <option value="regional">Regional</option>
    <option value="lbf">LBF</option>
    <option value="central_plains">Central Plains</option>
    <option value="spc_severe">SPC Severe</option>
  </select>
</div>

<div class="controls">
  <button onclick="togglePlay()" id="playBtn">▶ Play</button>
  <button onclick="latestRun()">Latest</button>
  <input id="slider" type="range" min="0" max="48" value="0">
  <div id="fhrLabel">000</div>
</div>

<div class="save-controls">
  <button onclick="savePNG()" id="savePngBtn">Save PNG</button>

  <label>GIF Start:</label>
  <div class="gif-range">
    <input id="gifStart" type="range" min="0" max="48" value="0">
    <span class="range-value" id="gifStartLabel">F000</span>
  </div>

  <label>GIF End:</label>
  <div class="gif-range">
    <input id="gifEnd" type="range" min="0" max="48" value="48">
    <span class="range-value" id="gifEndLabel">F048</span>
  </div>

  <label>Speed:</label>
  <select id="gifDelay">
    <option value="250">Fast</option>
    <option value="450" selected>Normal</option>
    <option value="700">Slow</option>
  </select>

  <label class="loop-option">
    <input id="gifLoop" type="checkbox" checked>
    Loop forever
  </label>

  <button onclick="saveGIF()" id="saveGifBtn">Save GIF</button>
  <span id="saveStatus"></span>
</div>

<div class="tiles" id="tiles"></div>

<div class="plot-wrap" id="plotWrap">
  <div class="plot-panel">
    <div class="panel-title" id="leftPanelTitle"></div>
    <img class="plot-image" id="leftPlot" src="" alt="Left model plot">
  </div>

  <div class="plot-panel" id="rightPanel">
    <div class="panel-title" id="rightPanelTitle"></div>
    <img class="plot-image" id="rightPlot" src="" alt="Right model plot">
  </div>
</div>

<div class="footer">
  Developed by Matthew Labenz<br>
  NWS North Platte, Nebraska
</div>

<script src="assets/gif.js"></script>
<script>
const BASE_URL = "https://mtl-nwslbf-model-data.s3.us-east-2.amazonaws.com";

const params = new URLSearchParams(window.location.search);

let selectedView = params.get("view") || "single";
let selectedModel = params.get("model") || "hrrr";
let selectedMember = params.get("member") || "m01";
let leftProduct = params.get("product") || "refl_uh";
let rightProduct = params.get("rightProduct") || "max_uh_02";

let selectedRun = "";
let selectedDomain = "regional";
let current = 0;
let maxFhr = 18;
let availableFrames = [];
let playing = false;
let timer = null;
let runs = [];
let creatingGif = false;

const viewSelect = document.getElementById("viewSelect");
const modelSelect = document.getElementById("modelSelect");
const memberSelect = document.getElementById("memberSelect");
const memberBlock = document.getElementById("memberBlock");
const leftProductSelect = document.getElementById("leftProductSelect");
const rightProductSelect = document.getElementById("rightProductSelect");
const rightProductBlock = document.getElementById("rightProductBlock");
const leftProductLabel = document.getElementById("leftProductLabel");
const runSelect = document.getElementById("runSelect");
const domainSelect = document.getElementById("domainSelect");
const slider = document.getElementById("slider");
const leftPlot = document.getElementById("leftPlot");
const rightPlot = document.getElementById("rightPlot");
const rightPanel = document.getElementById("rightPanel");
const plotWrap = document.getElementById("plotWrap");
const tiles = document.getElementById("tiles");
const fhrLabel = document.getElementById("fhrLabel");
const playBtn = document.getElementById("playBtn");
const viewerTitle = document.getElementById("viewerTitle");
const leftPanelTitle = document.getElementById("leftPanelTitle");
const rightPanelTitle = document.getElementById("rightPanelTitle");
const savePngBtn = document.getElementById("savePngBtn");
const saveGifBtn = document.getElementById("saveGifBtn");
const gifStart = document.getElementById("gifStart");
const gifEnd = document.getElementById("gifEnd");
const gifStartLabel = document.getElementById("gifStartLabel");
const gifEndLabel = document.getElementById("gifEndLabel");
const gifDelay = document.getElementById("gifDelay");
const gifLoop = document.getElementById("gifLoop");
const saveStatus = document.getElementById("saveStatus");

viewSelect.value = selectedView;
modelSelect.value = selectedModel;
memberSelect.value = selectedMember;

function formatFhr(fhr) {
  return "F" + String(Number(fhr)).padStart(3, "0");
}

function productOptionsForModel() {
  if (selectedModel === "hrrr") {
    return [
      ["refl_uh", "Reflectivity/UH"],
      ["hail_swath", "Hail Swath"],
      ["max_uh_02", "Max 0-2 km UH"]
    ];
  }

  return [
    ["refl_uh", "Reflectivity/UH"],
    ["hail_swath", "Hail Swath"]
  ];
}

function productLabel(product) {
  const match = productOptionsForModel().find(item => item[0] === product);
  return match ? match[1] : product;
}

function populateProductSelect(select, selectedValue) {
  select.innerHTML = "";

  const options = productOptionsForModel();

  options.forEach(([value, label]) => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    select.appendChild(option);
  });

  const values = options.map(item => item[0]);

  if (!values.includes(selectedValue)) {
    selectedValue = values[0];
  }

  select.value = selectedValue;
  return selectedValue;
}

function updateProductOptions() {
  leftProduct = populateProductSelect(leftProductSelect, leftProduct);
  rightProduct = populateProductSelect(rightProductSelect, rightProduct);

  if (selectedView === "compare" && rightProduct === leftProduct) {
    const other = productOptionsForModel().find(item => item[0] !== leftProduct);
    if (other) {
      rightProduct = other[0];
      rightProductSelect.value = rightProduct;
    }
  }
}

function updateMemberVisibility() {
  memberBlock.style.display =
    selectedModel === "refs" ? "inline-flex" : "none";
}

function updateViewVisibility() {
  const compare = selectedView === "compare";

  rightProductBlock.style.display = compare ? "inline-flex" : "none";
  rightPanel.style.display = compare ? "block" : "none";
  plotWrap.classList.toggle("compare", compare);
  leftProductLabel.textContent = compare ? "Left Product:" : "Product:";
  savePngBtn.textContent = compare ? "Save Two-Panel PNG" : "Save PNG";
}

function updateTitle() {
  let modelLabel = selectedModel.toUpperCase();

  if (selectedModel === "refs") {
    modelLabel = "REFS " + selectedMember.toUpperCase();
  }

  if (selectedView === "compare") {
    viewerTitle.textContent =
      `${modelLabel} Product Comparison`;

    leftPanelTitle.textContent = productLabel(leftProduct);
    rightPanelTitle.textContent = productLabel(rightProduct);
  } else {
    viewerTitle.textContent =
      `${modelLabel} ${productLabel(leftProduct)}`;

    leftPanelTitle.textContent = "";
    rightPanelTitle.textContent = "";
  }
}

function getProductPath(product) {
  if (selectedModel === "refs") {
    return `/runs/cams/refs/${selectedMember}/${product}`;
  }

  return `/runs/cams/${selectedModel}/${product}`;
}

function getFileName(product, fhr) {
  const f = String(fhr).padStart(3, "0");

  if (selectedModel === "refs") {
    if (product === "hail_swath") {
      return `refs_${selectedMember}_hail_swath_f${f}.png`;
    }

    return `refs_${selectedMember}_lbf_f${f}.png`;
  }

  if (product === "hail_swath") {
    return `${selectedModel}_hail_swath_f${f}.png`;
  }

  if (product === "max_uh_02") {
    return `${selectedModel}_max_uh_02_f${f}.png`;
  }

  return `${selectedModel}_lbf_f${f}.png`;
}

function imgSrc(product, fhr) {
  if (!selectedRun) return "";

  return (
    BASE_URL +
    getProductPath(product) +
    "/" +
    selectedRun +
    "/" +
    selectedDomain +
    "/" +
    getFileName(product, fhr) +
    "?t=" +
    Date.now()
  );
}

function runId(run) {
  return typeof run === "string" ? run : run.id;
}

function runLabel(run) {
  if (typeof run === "string") {
    return run.replace("_", " ");
  }

  return run.label || run.id;
}

async function fetchRunsForProduct(product) {
  const url =
    BASE_URL +
    getProductPath(product) +
    "/runs.json?t=" +
    Date.now();

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();
    return data.runs || [];
  } catch (err) {
    console.error("Could not load runs.json:", url, err);
    return [];
  }
}

async function loadRunsJson() {
  const leftRuns = await fetchRunsForProduct(leftProduct);

  if (selectedView === "single") {
    runs = leftRuns;
  } else {
    const rightRuns = await fetchRunsForProduct(rightProduct);
    const rightIds = new Set(rightRuns.map(runId));

    runs = leftRuns.filter(run => rightIds.has(runId(run)));
  }

  if (runs.length > 0) {
    const ids = runs.map(runId);

    if (!ids.includes(selectedRun)) {
      selectedRun = ids[0];
    }
  } else {
    selectedRun = "";
  }
}

function populateRunDropdown() {
  runSelect.innerHTML = "";

  runs.forEach(run => {
    const option = document.createElement("option");
    option.value = runId(run);
    option.textContent = runLabel(run);
    runSelect.appendChild(option);
  });

  runSelect.value = selectedRun;
}

function runMaxFhr(run) {
  if (
    run &&
    typeof run !== "string" &&
    run.max_fhr !== undefined
  ) {
    return Number(run.max_fhr);
  }

  const id = runId(run || selectedRun);
  const hourText = (id.split("_")[1] || "").replace("z", "");
  const hour = Number(hourText);

  return [0, 6, 12, 18].includes(hour) ? 48 : 18;
}

function updateMaxFhrForRun() {
  const runObject = runs.find(run => runId(run) === selectedRun);
  maxFhr = runMaxFhr(runObject);
  slider.max = maxFhr;
}

function resetGifRange() {
  gifStart.min = 0;
  gifEnd.min = 0;
  gifStart.max = maxFhr;
  gifEnd.max = maxFhr;
  gifStart.value = 0;
  gifEnd.value = maxFhr;
  gifStartLabel.textContent = formatFhr(0);
  gifEndLabel.textContent = formatFhr(maxFhr);
}

function syncGifRangeLabels() {
  let start = Number(gifStart.value);
  let end = Number(gifEnd.value);

  if (start > end) {
    end = start;
    gifEnd.value = end;
  }

  gifStartLabel.textContent = formatFhr(start);
  gifEndLabel.textContent = formatFhr(end);
}

async function frameExists(product, fhr) {
  try {
    const response = await fetch(imgSrc(product, fhr), {
      method: "HEAD"
    });

    return response.ok;
  } catch (err) {
    return false;
  }
}

async function refreshHourAvailability() {
  availableFrames = [];
  updateMaxFhrForRun();

  if (tiles.children.length !== maxFhr + 1) {
    tiles.innerHTML = "";

    for (let f = 0; f <= maxFhr; f++) {
      const button = document.createElement("button");

      button.className = "frame missing";
      button.textContent = String(f).padStart(3, "0");
      button.disabled = true;
      button.dataset.fhr = f;
      button.onclick = () => setFrame(f);

      tiles.appendChild(button);
    }
  }

  for (let f = 0; f <= maxFhr; f++) {
    const button = tiles.children[f];

    const leftAvailable = await frameExists(leftProduct, f);
    const rightAvailable =
      selectedView === "compare"
        ? await frameExists(rightProduct, f)
        : true;

    if (leftAvailable && rightAvailable) {
      availableFrames.push(f);
      button.disabled = false;
      button.className = "frame available";
    } else {
      button.disabled = true;
      button.className = "frame missing";
    }
  }

  updateActiveButton();
}

function firstAvailableFrame() {
  return availableFrames.length > 0 ? availableFrames[0] : 0;
}

function updateActiveButton() {
  document.querySelectorAll(".frame").forEach(button => {
    button.classList.remove("active");

    if (Number(button.dataset.fhr) === current) {
      button.classList.add("active");
    }
  });
}

function setFrame(fhr) {
  if (!selectedRun) return;

  current = Number(fhr);
  slider.value = current;
  fhrLabel.textContent = String(current).padStart(3, "0");

  leftPlot.src = imgSrc(leftProduct, current);

  if (selectedView === "compare") {
    rightPlot.src = imgSrc(rightProduct, current);
  }

  updateActiveButton();
}

slider.addEventListener("input", () => {
  const fhr = Number(slider.value);

  if (availableFrames.includes(fhr)) {
    setFrame(fhr);
  } else {
    slider.value = current;
  }
});

function togglePlay() {
  playing = !playing;
  playBtn.textContent = playing ? "⏸ Pause" : "▶ Play";

  if (!playing) {
    clearInterval(timer);
    return;
  }

  timer = setInterval(() => {
    if (availableFrames.length === 0) return;

    let index = availableFrames.indexOf(current);
    index = (index + 1) % availableFrames.length;

    setFrame(availableFrames[index]);
  }, 700);
}

async function refreshViewer() {
  await loadRunsJson();
  populateRunDropdown();
  await refreshHourAvailability();
  resetGifRange();

  if (
    current > maxFhr ||
    !availableFrames.includes(current)
  ) {
    setFrame(firstAvailableFrame());
  } else {
    setFrame(current);
  }
}

async function latestRun() {
  selectedRun = "";
  await refreshViewer();
  setFrame(firstAvailableFrame());
}

async function changeView() {
  selectedView = viewSelect.value;
  selectedRun = "";

  updateProductOptions();
  updateViewVisibility();
  updateTitle();

  await refreshViewer();
}

async function changeModel() {
  selectedModel = modelSelect.value;

  if (selectedModel !== "refs") {
    selectedMember = "m01";
  } else {
    selectedMember = memberSelect.value;
  }

  leftProduct = "refl_uh";
  rightProduct = selectedModel === "hrrr" ? "max_uh_02" : "hail_swath";
  selectedRun = "";

  updateMemberVisibility();
  updateProductOptions();
  updateViewVisibility();
  updateTitle();

  await refreshViewer();
}

async function changeMember() {
  selectedMember = memberSelect.value;
  selectedRun = "";

  updateTitle();
  await refreshViewer();
}

async function changeLeftProduct() {
  leftProduct = leftProductSelect.value;

  if (
    selectedView === "compare" &&
    leftProduct === rightProduct
  ) {
    const other = productOptionsForModel().find(
      item => item[0] !== leftProduct
    );

    if (other) {
      rightProduct = other[0];
      rightProductSelect.value = rightProduct;
    }
  }

  selectedRun = "";
  updateTitle();
  await refreshViewer();
}

async function changeRightProduct() {
  rightProduct = rightProductSelect.value;

  if (rightProduct === leftProduct) {
    const other = productOptionsForModel().find(
      item => item[0] !== rightProduct
    );

    if (other) {
      leftProduct = other[0];
      leftProductSelect.value = leftProduct;
    }
  }

  selectedRun = "";
  updateTitle();
  await refreshViewer();
}

async function changeRun() {
  selectedRun = runSelect.value;
  await refreshHourAvailability();
  resetGifRange();

  if (
    current > maxFhr ||
    !availableFrames.includes(current)
  ) {
    setFrame(firstAvailableFrame());
  } else {
    setFrame(current);
  }
}

async function changeDomain() {
  selectedDomain = domainSelect.value;
  await refreshHourAvailability();

  if (!availableFrames.includes(current)) {
    setFrame(firstAvailableFrame());
  } else {
    setFrame(current);
  }
}

function buildDownloadName(extension, startFhr = null, endFhr = null) {
  const memberPart =
    selectedModel === "refs"
      ? "_" + selectedMember
      : "";

  const productPart =
    selectedView === "compare"
      ? `${leftProduct}_vs_${rightProduct}`
      : leftProduct;

  let filename =
    selectedModel +
    memberPart +
    "_" +
    productPart +
    "_" +
    selectedRun +
    "_" +
    selectedDomain;

  if (startFhr !== null && endFhr !== null) {
    filename +=
      "_f" +
      String(startFhr).padStart(3, "0") +
      "-f" +
      String(endFhr).padStart(3, "0");
  } else {
    filename +=
      "_f" +
      String(current).padStart(3, "0");
  }

  return filename + "." + extension;
}

function downloadBlob(blob, filename) {
  const objectUrl = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = objectUrl;
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
}

async function fetchImage(product, fhr) {
  const response = await fetch(imgSrc(product, fhr));

  if (!response.ok) {
    throw new Error(`Could not load ${product} F${fhr}`);
  }

  const blob = await response.blob();
  const objectUrl = URL.createObjectURL(blob);

  try {
    return await new Promise((resolve, reject) => {
      const image = new Image();

      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = objectUrl;
    });
  } finally {
    setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
  }
}

function drawImageContain(ctx, image, x, y, width, height) {
  const scale = Math.min(width / image.width, height / image.height);
  const drawWidth = image.width * scale;
  const drawHeight = image.height * scale;
  const drawX = x + (width - drawWidth) / 2;
  const drawY = y + (height - drawHeight) / 2;

  ctx.drawImage(image, drawX, drawY, drawWidth, drawHeight);
}

async function createCombinedCanvas(fhr) {
  const leftImage = await fetchImage(leftProduct, fhr);

  if (selectedView === "single") {
    const canvas = document.createElement("canvas");
    canvas.width = leftImage.width;
    canvas.height = leftImage.height;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(leftImage, 0, 0);

    return canvas;
  }

  const rightImage = await fetchImage(rightProduct, fhr);
  const panelWidth = Math.max(leftImage.width, rightImage.width);
  const panelHeight = Math.max(leftImage.height, rightImage.height);

  const canvas = document.createElement("canvas");
  canvas.width = panelWidth * 2;
  canvas.height = panelHeight;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawImageContain(ctx, leftImage, 0, 0, panelWidth, panelHeight);
  drawImageContain(
    ctx,
    rightImage,
    panelWidth,
    0,
    panelWidth,
    panelHeight
  );

  return canvas;
}

async function savePNG() {
  if (!selectedRun || !availableFrames.includes(current)) {
    alert("No available frame is currently displayed.");
    return;
  }

  savePngBtn.disabled = true;
  saveStatus.textContent = "Saving PNG...";

  try {
    const canvas = await createCombinedCanvas(current);

    canvas.toBlob(blob => {
      if (!blob) {
        throw new Error("Could not create PNG");
      }

      downloadBlob(blob, buildDownloadName("png"));
    }, "image/png");

    saveStatus.textContent = "PNG saved";
  } catch (err) {
    console.error(err);
    alert("The PNG could not be created.");
    saveStatus.textContent = "";
  } finally {
    savePngBtn.disabled = false;

    setTimeout(() => {
      if (!creatingGif) saveStatus.textContent = "";
    }, 2500);
  }
}

function setGifControlsDisabled(disabled) {
  saveGifBtn.disabled = disabled;
  savePngBtn.disabled = disabled;
  gifStart.disabled = disabled;
  gifEnd.disabled = disabled;
  gifDelay.disabled = disabled;
  gifLoop.disabled = disabled;
}

async function saveGIF() {
  if (creatingGif) return;

  if (typeof GIF === "undefined") {
    alert("gif.js did not load.");
    return;
  }

  const startHour = Number(gifStart.value);
  const endHour = Number(gifEnd.value);

  const selectedFrames = availableFrames.filter(
    fhr => fhr >= startHour && fhr <= endHour
  );

  if (selectedFrames.length === 0) {
    alert("No available frames were found in the selected GIF range.");
    return;
  }

  creatingGif = true;
  setGifControlsDisabled(true);

  const delay = Number(gifDelay.value);

  const gif = new GIF({
    workers: 2,
    quality: 10,
    repeat: gifLoop.checked ? 0 : -1,
    workerScript: "assets/gif.worker.js"
  });

  try {
    for (let i = 0; i < selectedFrames.length; i++) {
      const fhr = selectedFrames[i];

      saveGifBtn.textContent =
        `Loading ${i + 1}/${selectedFrames.length}`;
      saveStatus.textContent = `Loading ${formatFhr(fhr)}`;

      const canvas = await createCombinedCanvas(fhr);

      gif.addFrame(canvas, {
        copy: true,
        delay:
          i === selectedFrames.length - 1
            ? Math.max(delay, 1000)
            : delay
      });
    }

    saveGifBtn.textContent = "Creating...";
    saveStatus.textContent =
      `Rendering ${selectedFrames.length} frames`;

    gif.on("progress", progress => {
      saveStatus.textContent =
        `Rendering ${Math.round(progress * 100)}%`;
    });

    gif.on("finished", blob => {
      downloadBlob(
        blob,
        buildDownloadName("gif", startHour, endHour)
      );

      creatingGif = false;
      setGifControlsDisabled(false);
      saveGifBtn.textContent = "Save GIF";
      saveStatus.textContent = "GIF saved";

      setTimeout(() => {
        saveStatus.textContent = "";
      }, 2500);
    });

    gif.render();
  } catch (err) {
    console.error(err);

    creatingGif = false;
    setGifControlsDisabled(false);
    saveGifBtn.textContent = "Save GIF";
    saveStatus.textContent = "";

    alert("The GIF could not be created.");
  }
}

gifStart.addEventListener("input", () => {
  if (Number(gifStart.value) > Number(gifEnd.value)) {
    gifEnd.value = gifStart.value;
  }

  syncGifRangeLabels();
});

gifEnd.addEventListener("input", () => {
  if (Number(gifEnd.value) < Number(gifStart.value)) {
    gifStart.value = gifEnd.value;
  }

  syncGifRangeLabels();
});

async function init() {
  updateMemberVisibility();
  updateProductOptions();
  updateViewVisibility();
  updateTitle();

  await refreshViewer();
  setFrame(firstAvailableFrame());

  setInterval(async () => {
    if (!creatingGif) {
      await refreshViewer();
    }
  }, 30000);
}

init();
</script>
