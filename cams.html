<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CAMs Viewer</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #111 0%, #080808 100%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .navbar, .subbar {
      text-align: left;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .navbar {
      background: #1a1a1a;
      padding: 14px 24px;
      font-size: 22px;
    }

    .subbar {
      background: #151515;
      padding: 10px 24px;
      font-size: 16px;
    }

    .navbar a, .subbar a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
      transition: 0.2s ease;
    }

    .navbar a:hover, .subbar a:hover {
      color: #6ea8ff;
      text-shadow: 0 0 10px rgba(110,168,255,0.35);
    }

    .navbar span, .subbar span {
      color: #777;
    }

    .topbar {
      background: #1b1b1b;
      padding: 14px 18px;
      border-bottom: 1px solid #333;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    select, button {
      background: #2c2c2c;
      color: white;
      border: 1px solid #555;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    select:hover, button:hover {
      border-color: #6ea8ff;
      box-shadow: 0 0 10px rgba(110,168,255,0.2);
    }

    .topbar label {
      font-weight: bold;
    }

    .topbar select {
      min-width: 120px;
    }

    #runSelect {
      min-width: 170px;
    }

    #domainSelect {
      min-width: 150px;
    }

    #memberBlock {
      display: none;
    }

    #viewerTitle {
      font-size: 22px;
      font-weight: 800;
      margin-right: 18px;
    }

    .controls {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 12px;
      padding: 12px 16px;
      background: #181818;
      border-bottom: 1px solid #2c2c2c;
    }

    input[type="range"] {
      width: 100%;
    }

    .tiles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      padding: 6px 10px 2px 10px;
      background: #101010;
    }

    .frame {
      min-width: 44px;
      padding: 6px 9px;
      border-radius: 5px;
      transition: 0.2s ease;
    }

    .available {
      background: #2b7cff;
      color: white;
      border-color: #9ec0ff;
      cursor: pointer;
    }

    .available:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(110,168,255,0.35);
    }

    .missing {
      background: #111;
      color: #aaa;
      border-color: #555;
    }

    .frame:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .active {
      outline: 2px solid white;
    }

    .plot-wrap {
      padding: 12px 16px 40px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #plot {
      width: auto;
      max-width: 70vw;
      height: auto;
      max-height: none;
      border: 1px solid #333;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 0 22px rgba(0,0,0,0.45);
      image-rendering: auto;
    }

    .footer {
      color: #777;
      font-size: 15px;
      margin: 28px 0 34px 0;
      line-height: 1.6;
    }


    .save-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #151515;
      border-bottom: 1px solid #2c2c2c;
    }

    .save-controls label {
      font-weight: bold;
      font-size: 14px;
    }

    .gif-range {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 245px;
    }

    .gif-range input[type="range"] {
      width: 150px;
    }

    .range-value {
      min-width: 38px;
      font-weight: bold;
      color: #9ec0ff;
    }

    .loop-option {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    #saveStatus {
      min-width: 130px;
      color: #aaa;
      font-size: 13px;
      text-align: left;
    }

    button:disabled,
    select:disabled,
    input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .navbar {
        font-size: 18px;
      }

      .subbar {
        font-size: 14px;
      }

      #viewerTitle {
        width: 100%;
        margin-bottom: 8px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .save-controls {
        flex-direction: column;
      }

      .gif-range {
        width: 100%;
        justify-content: center;
      }

      #saveStatus {
        text-align: center;
      }
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="index.html">HOME</a>
  <span>/</span>
  <a href="cams.html?model=hrrr">CAMs</a>
  <span>/</span>
  <a href="mesoensprob.html">MESO-ENS PROB</a>
</div>

<div class="subbar">
  <a href="cams.html?model=hrrr">HRRR</a>
  <span>/</span>
  <a href="cams.html?model=rrfs">RRFS</a>
  <span>/</span>
  <a href="cams.html?model=refs&member=m01">REFS MEM01-05</a>
</div>

<div class="topbar">
  <b id="viewerTitle">HRRR Reflectivity/UH</b>

  <label>Model:</label>
  <select id="modelSelect" onchange="changeModel()">
    <option value="hrrr">HRRR</option>
    <option value="rrfs">RRFS</option>
    <option value="refs">REFS</option>
  </select>

  <span id="memberBlock">
    <label>Member:</label>
    <select id="memberSelect" onchange="changeMember()">
      <option value="m01">M01</option>
      <option value="m02">M02</option>
      <option value="m03">M03</option>
      <option value="m04">M04</option>
      <option value="m05">M05</option>
    </select>
  </span>

  <label>Product:</label>
  <select id="productSelect" onchange="changeProduct()"></select>

  <label>Run:</label>
  <select id="runSelect" onchange="changeRun()"></select>

  <label>Domain:</label>
  <select id="domainSelect" onchange="changeDomain()">
    <option value="regional">Regional</option>
    <option value="lbf">LBF</option>
    <option value="central_plains">Central Plains</option>
    <option value="spc_severe">SPC Severe</option>
  </select>
</div>

<div class="controls">
  <button onclick="togglePlay()" id="playBtn">▶ Play</button>
  <button onclick="latestRun()">Latest</button>
  <input id="slider" type="range" min="0" max="48" value="0">
  <div id="fhrLabel">000</div>
</div>

<div class="save-controls">
  <button onclick="savePNG()" id="savePngBtn">Save PNG</button>

  <label>GIF Start:</label>
  <div class="gif-range">
    <input id="gifStart" type="range" min="0" max="48" value="0">
    <span class="range-value" id="gifStartLabel">F000</span>
  </div>

  <label>GIF End:</label>
  <div class="gif-range">
    <input id="gifEnd" type="range" min="0" max="48" value="48">
    <span class="range-value" id="gifEndLabel">F048</span>
  </div>

  <label>Speed:</label>
  <select id="gifDelay">
    <option value="250">Fast</option>
    <option value="450" selected>Normal</option>
    <option value="700">Slow</option>
  </select>

  <label class="loop-option">
    <input id="gifLoop" type="checkbox" checked>
    Loop forever
  </label>

  <button onclick="saveGIF()" id="saveGifBtn">Save GIF</button>

  <span id="saveStatus"></span>
</div>

<div class="tiles" id="tiles"></div>

<div class="plot-wrap">
  <img id="plot" src="">
</div>

<div class="footer">
  Developed by Matthew Labenz<br>
  NWS North Platte, Nebraska
</div>

<script src="assets/gif.js"></script>
<script>
const BASE_URL = "https://mtl-nwslbf-model-data.s3.us-east-2.amazonaws.com";

const params = new URLSearchParams(window.location.search);

let selectedModel = params.get("model") || "hrrr";
let selectedMember = params.get("member") || "m01";
let selectedProduct = params.get("product") || "refl_uh";

let selectedRun = "";
let selectedDomain = "regional";
let current = 0;
let maxFhr = 18;
let availableFrames = [];
let playing = false;
let timer = null;
let runs = [];
let creatingGif = false;

const modelSelect = document.getElementById("modelSelect");
const memberSelect = document.getElementById("memberSelect");
const memberBlock = document.getElementById("memberBlock");
const productSelect = document.getElementById("productSelect");
const runSelect = document.getElementById("runSelect");
const domainSelect = document.getElementById("domainSelect");
const slider = document.getElementById("slider");
const plot = document.getElementById("plot");
const tiles = document.getElementById("tiles");
const fhrLabel = document.getElementById("fhrLabel");
const playBtn = document.getElementById("playBtn");
const viewerTitle = document.getElementById("viewerTitle");
const savePngBtn = document.getElementById("savePngBtn");
const saveGifBtn = document.getElementById("saveGifBtn");
const gifStart = document.getElementById("gifStart");
const gifEnd = document.getElementById("gifEnd");
const gifStartLabel = document.getElementById("gifStartLabel");
const gifEndLabel = document.getElementById("gifEndLabel");
const gifDelay = document.getElementById("gifDelay");
const gifLoop = document.getElementById("gifLoop");
const saveStatus = document.getElementById("saveStatus");

modelSelect.value = selectedModel;
memberSelect.value = selectedMember;

function fhrText(fhr) {
  return "F" + String(fhr).padStart(3, "0");
}

function updateGifRangeControls(resetRange = false) {
  gifStart.max = maxFhr;
  gifEnd.max = maxFhr;

  if (resetRange) {
    gifStart.value = 0;
    gifEnd.value = maxFhr;
  } else {
    if (Number(gifStart.value) > maxFhr) {
      gifStart.value = 0;
    }

    if (Number(gifEnd.value) > maxFhr) {
      gifEnd.value = maxFhr;
    }
  }

  if (Number(gifStart.value) > Number(gifEnd.value)) {
    gifEnd.value = gifStart.value;
  }

  gifStartLabel.textContent = fhrText(gifStart.value);
  gifEndLabel.textContent = fhrText(gifEnd.value);
}

function updateMemberVisibility() {
  memberBlock.style.display =
    selectedModel === "refs" ? "inline-flex" : "none";
}

function addProductOption(value, label) {
  const opt = document.createElement("option");
  opt.value = value;
  opt.textContent = label;
  productSelect.appendChild(opt);
}

function updateProductOptions() {

  productSelect.innerHTML = "";

  if (selectedModel === "hrrr") {
    addProductOption("refl_uh", "Reflectivity/UH");
    addProductOption("hail_swath", "Hail Swath");
    addProductOption("max_uh_02", "Max 0-2 km UH");
  }

  else if (selectedModel === "rrfs") {
    addProductOption("refl_uh", "Reflectivity/UH");
    addProductOption("hail_swath", "Hail Swath");
  }

  else if (selectedModel === "refs") {
    addProductOption("refl_uh", "Reflectivity/UH");
    addProductOption("hail_swath", "Hail Swath");
  }

  const values =
    Array.from(productSelect.options).map(o => o.value);

  if (!values.includes(selectedProduct)) {
    selectedProduct = values[0] || "refl_uh";
  }

  productSelect.value = selectedProduct;
}

function updateTitle() {

  let modelLabel = selectedModel.toUpperCase();

  if (selectedModel === "refs") {
    modelLabel = "REFS " + selectedMember.toUpperCase();
  }

  const productLabel =
    productSelect.options[
      productSelect.selectedIndex
    ]?.text || "";

  viewerTitle.textContent =
    `${modelLabel} ${productLabel}`;
}

function getProductPath() {

  if (selectedModel === "refs") {
    return `/runs/cams/refs/${selectedMember}/${selectedProduct}`;
  }

  return `/runs/cams/${selectedModel}/${selectedProduct}`;
}

function getFileName(fhr) {

  const f = String(fhr).padStart(3, "0");

  if (selectedModel === "refs") {

    if (selectedProduct === "hail_swath") {
      return `refs_${selectedMember}_hail_swath_f${f}.png`;
    }

    return `refs_${selectedMember}_lbf_f${f}.png`;
  }

  if (selectedProduct === "hail_swath") {
    return `${selectedModel}_hail_swath_f${f}.png`;
  }

  if (selectedProduct === "max_uh_02") {
    return `${selectedModel}_max_uh_02_f${f}.png`;
  }

  return `${selectedModel}_lbf_f${f}.png`;
}

function imgSrc(fhr) {

  if (!selectedRun) return "";

  return (
    BASE_URL +
    getProductPath() +
    "/" +
    selectedRun +
    "/" +
    selectedDomain +
    "/" +
    getFileName(fhr) +
    "?t=" +
    Date.now()
  );
}

function runId(run) {

  if (typeof run === "string") return run;

  return run.id;
}

function runLabel(run) {

  if (typeof run === "string") {
    return run.replace("_", " ");
  }

  return run.label || run.id;
}

function updateMaxFhrForRun() {

  const runObj =
    runs.find(r => runId(r) === selectedRun);

  if (
    runObj &&
    typeof runObj !== "string" &&
    runObj.max_fhr !== undefined
  ) {

    maxFhr = Number(runObj.max_fhr);

  } else {

    const hourText =
      selectedRun.split("_")[1] || "";

    const hour =
      Number(hourText.replace("z", ""));

    maxFhr =
      [0, 6, 12, 18].includes(hour)
      ? 48
      : 18;
  }

  slider.max = maxFhr;
  updateGifRangeControls(false);
}

async function loadRunsJson() {

  const runsPath =
    BASE_URL +
    getProductPath() +
    "/runs.json?t=" +
    Date.now();

  try {

    const response = await fetch(runsPath);

    const data = await response.json();

    runs = data.runs || [];

    if (runs.length > 0) {

      const oldRun = selectedRun;

      const runIds =
        runs.map(r => runId(r));

      if (runIds.includes(oldRun)) {
        selectedRun = oldRun;
      }

      else {
        selectedRun = runId(runs[0]);
      }

    } else {

      selectedRun = "";
    }

  } catch(err) {

    console.error(
      "Could not load runs.json:",
      runsPath,
      err
    );

    runs = [];
    selectedRun = "";
  }
}

function populateRunDropdown() {

  runSelect.innerHTML = "";

  runs.forEach(run => {

    const opt = document.createElement("option");

    opt.value = runId(run);

    opt.textContent = runLabel(run);

    runSelect.appendChild(opt);
  });

  runSelect.value = selectedRun;
}

async function refreshHourAvailability() {

  availableFrames = [];

  updateMaxFhrForRun();

  // Only build buttons if count changed
  if (tiles.children.length !== maxFhr + 1) {

    tiles.innerHTML = "";

    for (let f = 0; f <= maxFhr; f++) {

      const button =
        document.createElement("button");

      button.className = "frame missing";

      button.textContent =
        String(f).padStart(3, "0");

      button.disabled = true;

      button.dataset.fhr = f;

      button.onclick = () => {
        setFrame(f);
      };

      tiles.appendChild(button);
    }
  }

  // Only update state/styles
  for (let f = 0; f <= maxFhr; f++) {

    const button = tiles.children[f];

    try {

      const response =
        await fetch(imgSrc(f), {
          method: "HEAD"
        });

      if (response.ok) {

        availableFrames.push(f);

        button.disabled = false;

        button.className =
          "frame available";

      } else {

        button.disabled = true;

        button.className =
          "frame missing";
      }

    } catch(err) {

      button.disabled = true;

      button.className =
        "frame missing";
    }
  }

  updateActiveButton();
}

function firstAvailableFrame() {

  if (availableFrames.length === 0) {
    return 0;
  }

  return availableFrames[0];
}

function updateActiveButton() {

  document.querySelectorAll(".frame")
    .forEach(btn => {

      btn.classList.remove("active");

      if (
        Number(btn.dataset.fhr) === current
      ) {
        btn.classList.add("active");
      }
    });
}

function setFrame(fhr) {

  if (!selectedRun) return;

  current = Number(fhr);

  slider.value = current;

  fhrLabel.textContent =
    String(current).padStart(3, "0");

  plot.src = imgSrc(current);

  updateActiveButton();
}

slider.addEventListener("input", () => {

  const f = parseInt(slider.value);

  if (availableFrames.includes(f)) {
    setFrame(f);
  }

  else {
    slider.value = current;
  }
});


function buildDownloadName(extension, startFhr = null, endFhr = null) {
  const memberPart =
    selectedModel === "refs"
      ? "_" + selectedMember
      : "";

  let name =
    selectedModel +
    memberPart +
    "_" +
    selectedProduct +
    "_" +
    selectedRun +
    "_" +
    selectedDomain;

  if (startFhr !== null && endFhr !== null) {
    name +=
      "_f" +
      String(startFhr).padStart(3, "0") +
      "-f" +
      String(endFhr).padStart(3, "0");
  } else {
    name += "_f" + String(current).padStart(3, "0");
  }

  return name + "." + extension;
}

function downloadBlob(blob, filename) {
  const objectUrl = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = objectUrl;
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(() => {
    URL.revokeObjectURL(objectUrl);
  }, 1000);
}

async function savePNG() {
  if (!selectedRun || !availableFrames.includes(current)) {
    alert("No available frame is currently displayed.");
    return;
  }

  savePngBtn.disabled = true;
  saveStatus.textContent = "Saving PNG...";

  try {
    const response = await fetch(imgSrc(current));

    if (!response.ok) {
      throw new Error("PNG request failed");
    }

    const blob = await response.blob();

    downloadBlob(
      blob,
      buildDownloadName("png")
    );

    saveStatus.textContent = "PNG saved";
  } catch (err) {
    console.error("Could not save PNG:", err);
    saveStatus.textContent = "";
    alert(
      "The PNG could not be downloaded. Check the S3 bucket CORS settings."
    );
  } finally {
    savePngBtn.disabled = false;

    setTimeout(() => {
      if (!creatingGif) {
        saveStatus.textContent = "";
      }
    }, 2500);
  }
}

async function loadGifImage(fhr) {
  const response = await fetch(imgSrc(fhr));

  if (!response.ok) {
    throw new Error("Frame request failed");
  }

  const blob = await response.blob();
  const objectUrl = URL.createObjectURL(blob);

  try {
    const image = await new Promise((resolve, reject) => {
      const img = new Image();

      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = objectUrl;
    });

    return image;
  } finally {
    setTimeout(() => {
      URL.revokeObjectURL(objectUrl);
    }, 1000);
  }
}

async function saveGIF() {
  if (creatingGif) {
    return;
  }

  if (typeof GIF === "undefined") {
    alert(
      "gif.js did not load. Make sure assets/gif.js exists."
    );
    return;
  }

  let startHour = Number(gifStart.value);
  let endHour = Number(gifEnd.value);

  if (startHour > endHour) {
    const temp = startHour;
    startHour = endHour;
    endHour = temp;

    gifStart.value = startHour;
    gifEnd.value = endHour;
    updateGifRangeControls(false);
  }

  const selectedFrames =
    availableFrames.filter(
      fhr => fhr >= startHour && fhr <= endHour
    );

  if (selectedFrames.length === 0) {
    alert(
      "No available frames were found in the selected GIF range."
    );
    return;
  }

  creatingGif = true;
  saveGifBtn.disabled = true;
  savePngBtn.disabled = true;
  gifStart.disabled = true;
  gifEnd.disabled = true;
  gifDelay.disabled = true;
  gifLoop.disabled = true;

  const delay = Number(gifDelay.value);

  const gif = new GIF({
    workers: 2,
    quality: 10,
    repeat: gifLoop.checked ? 0 : -1,
    workerScript: "assets/gif.worker.js"
  });

  let framesAdded = 0;

  try {
    for (let i = 0; i < selectedFrames.length; i++) {
      const fhr = selectedFrames[i];

      saveGifBtn.textContent =
        "Loading " +
        (i + 1) +
        "/" +
        selectedFrames.length;

      saveStatus.textContent =
        "Loading " + fhrText(fhr);

      try {
        const image = await loadGifImage(fhr);

        gif.addFrame(image, {
          copy: true,
          delay:
            i === selectedFrames.length - 1
              ? Math.max(delay, 1000)
              : delay
        });

        framesAdded++;
      } catch (err) {
        console.warn(
          "Skipping unavailable frame " +
          fhrText(fhr),
          err
        );
      }
    }

    if (framesAdded === 0) {
      throw new Error("No frames could be loaded");
    }

    saveGifBtn.textContent = "Creating...";
    saveStatus.textContent =
      "Rendering " +
      framesAdded +
      " frame" +
      (framesAdded === 1 ? "" : "s");

    gif.on("progress", progress => {
      saveStatus.textContent =
        "Rendering " +
        Math.round(progress * 100) +
        "%";
    });

    gif.on("finished", blob => {
      downloadBlob(
        blob,
        buildDownloadName(
          "gif",
          startHour,
          endHour
        )
      );

      creatingGif = false;
      saveGifBtn.disabled = false;
      savePngBtn.disabled = false;
      gifStart.disabled = false;
      gifEnd.disabled = false;
      gifDelay.disabled = false;
      gifLoop.disabled = false;
      saveGifBtn.textContent = "Save GIF";
      saveStatus.textContent = "GIF saved";

      setTimeout(() => {
        saveStatus.textContent = "";
      }, 2500);
    });

    gif.on("abort", () => {
      throw new Error("GIF rendering stopped");
    });

    gif.render();

  } catch (err) {
    console.error("Could not create GIF:", err);

    creatingGif = false;
    saveGifBtn.disabled = false;
    savePngBtn.disabled = false;
    gifStart.disabled = false;
    gifEnd.disabled = false;
    gifDelay.disabled = false;
    gifLoop.disabled = false;
    saveGifBtn.textContent = "Save GIF";
    saveStatus.textContent = "";

    alert(
      "The GIF could not be created. Check that assets/gif.worker.js exists and that the S3 bucket allows CORS GET requests."
    );
  }
}

gifStart.addEventListener("input", () => {
  if (Number(gifStart.value) > Number(gifEnd.value)) {
    gifEnd.value = gifStart.value;
  }

  updateGifRangeControls(false);
});

gifEnd.addEventListener("input", () => {
  if (Number(gifEnd.value) < Number(gifStart.value)) {
    gifStart.value = gifEnd.value;
  }

  updateGifRangeControls(false);
});

function togglePlay() {

  playing = !playing;

  playBtn.textContent =
    playing ? "⏸ Pause" : "▶ Play";

  if (!playing) {

    clearInterval(timer);

    return;
  }

  timer = setInterval(() => {

    if (availableFrames.length === 0) {
      return;
    }

    let idx =
      availableFrames.indexOf(current);

    idx++;

    if (idx >= availableFrames.length) {
      idx = 0;
    }

    setFrame(availableFrames[idx]);

  }, 700);
}

async function refreshViewer() {

  await loadRunsJson();

  populateRunDropdown();

  await refreshHourAvailability();

  if (
    current > maxFhr ||
    !availableFrames.includes(current)
  ) {

    setFrame(firstAvailableFrame());

  } else {

    setFrame(current);
  }
}

async function latestRun() {

  selectedRun = "";

  await refreshViewer();

  updateGifRangeControls(true);

  setFrame(firstAvailableFrame());
}

async function changeModel() {

  selectedModel = modelSelect.value;

  if (selectedModel !== "refs") {
    selectedMember = "m01";
  }

  else {
    selectedMember = memberSelect.value;
  }

  selectedProduct = "";
  selectedRun = "";

  updateMemberVisibility();

  updateProductOptions();

  updateTitle();

  await refreshViewer();
}

async function changeMember() {

  selectedMember = memberSelect.value;

  selectedRun = "";

  updateTitle();

  await refreshViewer();
}

async function changeProduct() {

  selectedProduct =
    productSelect.value;

  selectedRun = "";

  updateTitle();

  await refreshViewer();
}

async function changeRun() {

  selectedRun = runSelect.value;

  await refreshHourAvailability();

  if (
    current > maxFhr ||
    !availableFrames.includes(current)
  ) {

    setFrame(firstAvailableFrame());

  } else {

    setFrame(current);
  }
}

async function changeDomain() {

  selectedDomain =
    domainSelect.value;

  if (
    current > maxFhr ||
    !availableFrames.includes(current)
  ) {

    setFrame(firstAvailableFrame());

  } else {

    setFrame(current);
  }
}

async function init() {

  updateMemberVisibility();

  updateProductOptions();

  updateTitle();

  await refreshViewer();

  setFrame(firstAvailableFrame());

  setInterval(async () => {

    if (!creatingGif) {
      await refreshViewer();
    }

  }, 30000);
}

init();
</script>
